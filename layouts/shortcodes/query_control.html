<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
      crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
<link href="https://unpkg.com/@triply/yasgui/build/yasgui.min.css" rel="stylesheet" type="text/css"/>
<script src="https://unpkg.com/@triply/yasgui/build/yasgui.min.js"></script>
<div class="container-fluid">
  <div class="row">
    <div class="col-4">
      <select id="examples_select" class="form-select form-select-sm" aria-label="">
        <option selected disabled>Select Example Query</option>
        {{ range .Page.Params.dropdown_items }}
        <option data-backend="{{ .backend }}" value="{{ .query_path }}">{{ .query_label }}</option>
        {{ end }}
      </select>

    </div>
  </div>
  <div class="row">
    <div class="col">
      <div id="yasgui_div" style="width: 100%;"></div>
    </div>
  </div>
</div>

<script>
  let yasgui;
  let yasgui_options;

  $(document).ready(function () {
    yasgui_options = {
      requestConfig: {endpoint: ""},
      copyEndpointOnNewTab: false,
      resizeable: true,
      autofocus: true,
    }
    yasgui = new Yasgui(document.getElementById("yasgui_div"), yasgui_options);
    yasgui.getTab().setQuery("");

    $('#examples_select')
      .on('change', function () {
        let enforced_endpoint = $('#examples_select option:selected').attr("data-backend");
        if (enforced_endpoint) {
          $("#endpoints_select").val(enforced_endpoint);
        }
        execute_example_query($('#examples_select :selected'));
      }).on('load', function () {
      let enforced_endpoint = $('#examples_select option:selected').attr("data-backend");
      if (enforced_endpoint) {
        $("#endpoints_select").val(enforced_endpoint);
      }
      execute_example_query($('#examples_select :selected'));
    });


  })

  function execute_example_query(select_obj) {
    const query_path = select_obj.val();
    const query_name = select_obj.text();
    const backend = select_obj.data("backend");

    $.ajax({
      url: query_path,
      method: 'GET',
      success: function (data) {
        // Create the new tab
        const tab = yasgui.addTab(true, {name: query_name});
        // Set query and endpoint
        tab.setQuery(data);
        tab.setEndpoint(backend);
        // Execute
        tab.query();
      },
      error: function (xhr, status, error) {
        console.error('Error loading query:', error);
      }
    });
  }
</script>
<style>
  .yasgui .autocompleteWrapper {
    display: none !important;
  }
</style>
